    expected_source_contains: "Demonstratoren"

  - id: q2_mrk_demonstratoren
    query: "Welche Demonstratoren gibt es zur Mensch-Roboter-Kollaboration?"
    expected_keywords: ["Mensch-Roboter", "Kollaboration"]
    expected_confidence: gruen
