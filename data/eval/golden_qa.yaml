  - id: q3_predictive_maintenance
    query: "Welche Anbieter von Predictive-Maintenance-Loesungen gibt es?"
    expected_keywords: ["Predictive", "Maintenance"]
    expected_confidence: gruen
    expected_source_contains: ["Abdalla", "Schwier"]

  - id: q4_raise3d
    query: "Wie funktioniert die additive Fertigung mit dem Raise3D?"
    expected_keywords: ["Raise3D", "additiv"]
    expected_confidence: gruen
    expected_source_contains: "Demonstratoren"

  - id: q5_siemens_umsatz
    query: "Wie hoch ist der Jahresumsatz von Siemens?"
    expected_keywords: []
