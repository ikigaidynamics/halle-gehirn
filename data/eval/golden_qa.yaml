# Golden Q&A — Baseline-Fragen fuer die Eval-Schleife
#
# Felder je Frage:
#   expected_keywords:        Stichworte die vorkommen MUESSEN (case-insensitive)
#   forbidden_keywords:       Stichworte die NICHT vorkommen duerfen (Refusal-Pruefung)
#   expected_confidence:      Ampel-Erwartung (gruen/gelb/rot)
#   expected_source_contains: Teilstring im datei-Feld der Top-Source

questions:
