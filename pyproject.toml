[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halle-gehirn"
version = "0.1.0"
description = "Halle-Gehirn — lokal-first, DSGVO-konformer RAG-Stack (Säule 1: Wissensbasis) für die Modellfabrik des Lehrstuhls KI-gestützte Automatisierungstechnik, BTU Cottbus-Senftenberg."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Robin Jost" }]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "qdrant-client",
    "docling",
    "fastembed",
    "ollama",
    "tiktoken",
    "pyyaml",
    "trafilatura",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "ragas",
    "datasets",
]

[project.optional-dependencies]
js = [
    "playwright",
]
ui = [
    "streamlit",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "types-PyYAML",
    "reportlab",
]

[tool.hatch.build.targets.wheel]
packages = ["src/halle_gehirn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
